name: Public source verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: evaluation
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: agentpay_hackathon_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U evaluation -d agentpay_hackathon_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://evaluation:isolated-ci-only@127.0.0.1:5432/agentpay_hackathon_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:public
      - run: npm run test:boundary
      - run: npm run test:sdk
      - run: npm run lint
      - run: node scripts/migrate.mjs
      - run: npm test
      - run: npm run build
      - run: npm run typecheck
