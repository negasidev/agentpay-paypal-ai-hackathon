name: Public source verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        source: [checkout, source-download]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: evaluation
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: agentpay_hackathon_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U evaluation -d agentpay_hackathon_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SOURCE_DIRECTORY: ${{ matrix.source == 'source-download' && format('{0}/../agentpay-source', github.workspace) || github.workspace }}
      DATABASE_URL: postgresql://evaluation:isolated-ci-only@127.0.0.1:5432/agentpay_hackathon_ci
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - name: Export exact committed source
        if: matrix.source == 'source-download'
        run: node scripts/package-acceptance.mjs "$GITHUB_SHA" "$SOURCE_DIRECTORY"
      - name: Audit clean source download
        if: matrix.source == 'source-download'
        working-directory: ${{ env.SOURCE_DIRECTORY }}
        run: node scripts/public-boundary.mjs --export .
      - working-directory: ${{ env.SOURCE_DIRECTORY }}
        run: npm ci
      - if: matrix.source == 'checkout'
        working-directory: ${{ env.SOURCE_DIRECTORY }}
        run: npm run check:public
      - working-directory: ${{ env.SOURCE_DIRECTORY }}
        run: npm run test:boundary
      - working-directory: ${{ env.SOURCE_DIRECTORY }}
        run: npm run test:sdk
      - working-directory: ${{ env.SOURCE_DIRECTORY }}
        run: npm run lint
      - working-directory: ${{ env.SOURCE_DIRECTORY }}
        run: node scripts/migrate.mjs
      - working-directory: ${{ env.SOURCE_DIRECTORY }}
        run: npm test
      - working-directory: ${{ env.SOURCE_DIRECTORY }}
        run: npm run build
      - working-directory: ${{ env.SOURCE_DIRECTORY }}
        run: npm run typecheck
